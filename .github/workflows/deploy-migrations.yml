name: Deploy database migrations

# Applies pending migrations in supabase/migrations/ to production whenever
# they land on main.
#
# Why this exists: until now, a migration reaching main depended entirely on
# someone remembering to also run it against production by hand, as a
# separate, unlogged step. Once, nobody did -- 20260825210000 sat merged on
# main for three PRs' worth of history while production silently lacked the
# column it added, and the only thing that ever depended on that column
# (sendWelcomeEmail) failed on every call with the failure swallowed by
# design at its one call site. See PR #12.
#
# Merging to main IS the deploy now. There is no second manual step left to
# forget. The verify step below is the safety net for the deploy step
# itself failing quietly, not a replacement for having one.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
  workflow_dispatch: {}

concurrency:
  group: deploy-migrations-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the production project
        run: supabase link --project-ref idmxottsjqeiatgiudvt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # `db push` already exits non-zero on error, but that only proves the
      # command didn't report failure -- this confirms the actual end state.
      # Every migration file in this checkout must show up in production's
      # own migration history afterward. Grepping the plain-text listing
      # rather than parsing a specific --output format, so this doesn't
      # silently stop checking anything if the CLI's structured-output
      # schema changes under it.
      - name: Verify no migration is missing from production
        run: |
          set -euo pipefail
          status=0
          listing="$(supabase migration list --linked)"
          for f in supabase/migrations/*.sql; do
            version="$(basename "$f" | cut -d'_' -f1)"
            if ! grep -q "$version" <<< "$listing"; then
              echo "::error file=$f::Migration $version is on main but does not appear in production's migration history after db push."
              status=1
            fi
          done
          exit "$status"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
